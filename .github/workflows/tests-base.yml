name: Tester la base de données

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/tests-base.yml"
  pull_request:
    paths:
      - "supabase/**"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm test
